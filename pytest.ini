[pytest]
testpaths = tests
addopts = -v --strict-markers
markers =
    smoke: quick sanity tests (run first, in a fixed order)
    unit: function-level tests
    module: class/module-level tests
    data_driven: tests that read their data from CSV files
    lru: LRUCache tests
    ttl: TTLCache tests
    lfu: LFUCache tests
